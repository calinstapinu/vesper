<svg xmlns="http://www.w3.org/2000/svg" class="m" viewBox="-30 -22 160 160" width="320" height="320" style="--accent:#5fe3a8">
<defs>
  <radialGradient id="gHalo"><stop offset=".45" stop-color="#ff4d4d" stop-opacity=".9"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></radialGradient>
  <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".65" stop-color="#f1f3f8"/><stop offset="1" stop-color="#dfe4ee"/></linearGradient>
</defs>
<style><![CDATA[
:root{--eye:#0b0e14}
/* mascot */
  .m{overflow:visible}
  .m .face{transform:translate(calc(var(--fx,0)*1px),calc(var(--fy,0)*1px));transition:transform .12s ease-out}
  .m .eyes{transform:translate(calc(var(--ex,0)*1px),calc(var(--ey,0)*1px));transition:transform .1s ease-out}
  .m .anim,.m .stemw,.m .blink,.m .scan,.m .shades,.m .spark,.m .zz text,.m .bellp,.m .ring,.m .winkR{transform-box:fill-box}
  .stem{fill:var(--accent,#fff)}
  .feat{stroke:var(--eye);fill:none;stroke-linecap:round;stroke-linejoin:round}
  .eyef{fill:var(--eye)}

  .blink{transform-origin:center;animation:blink 4.4s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
  .stemw{transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

  .a-breathe{transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  .a-focus{transform-origin:50% 100%;animation:breathe 5s ease-in-out infinite}
  .a-sleep{transform-origin:50% 100%;animation:sleep 5s ease-in-out infinite}
  @keyframes sleep{0%,100%{transform:scale(1.03,.97) rotate(-2deg)}50%{transform:scale(1,1) rotate(2deg)}}
  .a-hop{transform-origin:50% 100%;animation:hop 1s cubic-bezier(.3,.1,.3,1) infinite}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.94)}20%{transform:translateY(0) scale(.96,1.05)}50%{transform:translateY(-9px) scale(.98,1.03)}80%{transform:translateY(0) scale(1.06,.94)}}
  .a-droop{transform-origin:50% 100%;animation:droop 4s ease-in-out infinite}
  @keyframes droop{0%,100%{transform:translateY(1px) rotate(-3deg) scale(1.02,.96)}50%{transform:translateY(0) rotate(2deg) scale(1,.99)}}
  .a-shake{transform-origin:50% 100%;animation:shake 2.2s ease-in-out infinite}
  @keyframes shake{0%,50%,100%{transform:rotate(0)}56%{transform:rotate(-7deg)}62%{transform:rotate(7deg)}68%{transform:rotate(-5deg)}74%{transform:rotate(4deg)}82%{transform:rotate(0)}}
  .a-tilt{transform-origin:50% 100%;animation:tilt 4.4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

  .scan{transform-origin:center;animation:scan 4.4s ease-in-out infinite}
  @keyframes scan{0%,10%,100%{transform:translateX(0)}25%,40%{transform:translateX(-5px)}55%,70%{transform:translateX(5px)}85%{transform:translateX(0)}}
  .winkR{transform-origin:center;animation:wink 3.4s infinite}
  @keyframes wink{0%,60%,100%{transform:scaleY(1)}66%,84%{transform:scaleY(.08)}}
  .shades{animation:drop 4.4s infinite}
  @keyframes drop{0%,8%{transform:translateY(-34px)}18%{transform:translateY(2px)}22%,86%{transform:translateY(0)}96%,100%{transform:translateY(-34px)}}

  .spark{transform-origin:center;animation:tw 1s ease-in-out infinite}
  .spark:nth-of-type(2){animation-delay:.35s}.spark:nth-of-type(3){animation-delay:.7s}
  @keyframes tw{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1);opacity:1}}
  .zz text{font-weight:800;fill:#dfe6f2;opacity:0;animation:zz 2.6s ease-out infinite}
  .zz text:nth-child(2){animation-delay:.85s}.zz text:nth-child(3){animation-delay:1.7s}
  @keyframes zz{0%{opacity:0;transform:translate(-4px,8px) scale(.6)}20%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(10px,-24px) scale(1.15)}}

  /* session: semne de întrebare */
  .q{transform-box:fill-box;transform-origin:center;opacity:0;animation:q 2.4s ease-out infinite}
  .q.q2{animation-delay:.8s}.q.q3{animation-delay:1.6s}
  @keyframes q{0%{opacity:0;transform:translateY(8px) scale(.4)}25%{opacity:1;transform:translateY(0) scale(1.15)}65%{opacity:1;transform:translateY(-3px) scale(1)}100%{opacity:0;transform:translateY(-12px) scale(.9)}}
  /* session v2: lumânări verzi care cresc din cap */
  .candle{transform-box:fill-box;transform-origin:50% 100%;animation:candle 4.2s ease-in-out infinite}
  @keyframes candle{0%{transform:scaleY(.05)}14%{transform:scaleY(calc(var(--s,1)*1.15))}22%{transform:scaleY(var(--s,1))}45%{transform:scaleY(calc(var(--s,1)*.8))}65%{transform:scaleY(calc(var(--s,1)*1.08))}85%{transform:scaleY(var(--s,1))}96%,100%{transform:scaleY(.05)}}
  /* session v3: lupa care caută + particule ? și candele */
  .lupa{transform-origin:74px 66px;animation:lupa 8s ease-in-out infinite}
  @keyframes lupa{0%,6%{transform:translate(12px,-2px) rotate(8deg)}25%,75%{transform:translate(-22px,-8px) rotate(-1deg)}44%,56%{transform:translate(-56px,-2px) rotate(-10deg)}94%,100%{transform:translate(12px,-2px) rotate(8deg)}}
  .scan2.scanlupa{animation:scanl 8s ease-in-out infinite}
  @keyframes scanl{0%,6%{transform:translateX(5px)}44%,56%{transform:translateX(-5px)}94%,100%{transform:translateX(5px)}}
  /* out v2: bală */
  .drool{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:drool 7s ease-in infinite}
  @keyframes drool{0%,26%{opacity:0;transform:translateY(0) scale(0)}40%{opacity:1;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(1px) scale(1.15,1.4)}58%{opacity:1;transform:translateY(7px) scale(1,1.25)}74%{opacity:1;transform:translateY(30px) scale(.85,1.35)}76%,100%{opacity:0;transform:translateY(34px) scale(.5)}}
  .splash{transform-box:fill-box;transform-origin:center;opacity:0;animation:splash 7s ease-out infinite}
  @keyframes splash{0%,73%{opacity:0;transform:scale(.3)}76%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(1.9)}}
  .pt{transform-box:fill-box;transform-origin:center;opacity:0;animation:pt 3.2s ease-out infinite}
  @keyframes pt{0%{opacity:0;transform:translateY(8px) scale(.4)}18%{opacity:1;transform:translateY(0) scale(1.15)}50%{opacity:1;transform:translateY(-3px) scale(1)}78%{opacity:0;transform:translateY(-14px) scale(.9)}100%{opacity:0}}
  /* restricted: semne de exclamare + halo roșu */
  .ex{transform-box:fill-box;transform-origin:center;animation:ex .7s ease-in-out infinite alternate}
  .ex.e2{animation-delay:.35s}
  @keyframes ex{from{transform:scale(.85);opacity:.7}to{transform:scale(1.25);opacity:1}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo 1.4s ease-in-out infinite alternate}
  @keyframes halo{from{opacity:.08;transform:scale(.92)}to{opacity:.32;transform:scale(1.06)}}
  .a-nope{transform-origin:50% 100%;animation:nope 2.2s ease-in-out infinite}
  @keyframes nope{0%,45%,100%{transform:translateX(0)}51%{transform:translateX(-3.5px)}57%{transform:translateX(3.5px)}63%{transform:translateX(-3.5px)}69%{transform:translateX(3.5px)}75%{transform:translateX(0)}}
  .bar.restricted{box-shadow:inset 0 -2px 0 rgba(255,77,77,.55),0 6px 28px rgba(255,77,77,.3)}
  /* checklist complet: yupi */
  .a-yupi{transform-origin:50% 100%;animation:yupi 3s cubic-bezier(.3,.1,.3,1) infinite}
  @keyframes yupi{
    0%{transform:translateY(0) rotate(0) scale(1,1)}
    8%{transform:translateY(0) rotate(0) scale(1.1,.9)}
    28%{transform:translateY(-17px) rotate(360deg) scale(.96,1.05)}
    42%{transform:translateY(0) rotate(360deg) scale(1.1,.9)}
    52%{transform:translateY(-8px) rotate(360deg) scale(.98,1.03)}
    62%{transform:translateY(0) rotate(360deg) scale(1.05,.95)}
    72%,100%{transform:translateY(0) rotate(360deg) scale(1,1)}}
  .conf{transform-box:fill-box;transform-origin:center;opacity:0;animation:conf 3s ease-out infinite}
  @keyframes conf{0%,22%{opacity:0;transform:translate(0,0) scale(.3)}28%{opacity:1;transform:translate(0,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
  .badge{transform-box:fill-box;transform-origin:center;animation:badge 3s infinite}
  @keyframes badge{0%,22%{transform:scale(0);opacity:0}32%{transform:scale(1.3);opacity:1}40%,88%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
  .bellp{transform-origin:center;animation:pop 2.2s ease-in-out infinite}
  @keyframes pop{0%,48%{transform:scale(0);opacity:0}58%{transform:scale(1.25);opacity:1}66%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
  .ring{transform-origin:50% 20%;animation:ring .4s ease-in-out infinite alternate}
  @keyframes ring{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

.scan2{transform-box:fill-box}.scan2.scanon{animation:scan 4.4s ease-in-out infinite}
]]></style>

    <g class="face"><g class="anim a-yupi">
      
      <g transform="translate(50 0) scale(0.78 1) translate(-50 0)">
      <g class="stemw"><rect class="stem" x="40" y="2" width="20" height="32" rx="10"/><rect x="44" y="6" width="4.5" height="16" rx="2.2" fill="#fff" opacity=".55"/></g>
      <rect x="10" y="20" width="80" height="82" rx="34.6" ry="27" fill="url(#gFace)"/>
      <ellipse cx="29" cy="36" rx="11" ry="5.5" fill="#fff" opacity=".9" transform="rotate(-28 29 36)"/>
      <path class="feat" stroke-width="3.6" d="M27 67 q8 -13 16 0 M57 67 q8 -13 16 0"/><path class="eyef" d="M42 77 q8 14 16 0 z"/><ellipse cx="25" cy="76" rx="6" ry="3.4" fill="#ff9fb2" opacity=".5"/><ellipse cx="75" cy="76" rx="6" ry="3.4" fill="#ff9fb2" opacity=".5"/>
      
      </g>
    </g><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#5fe3a8" style="--dx:-44px;--dy:10px;--r:-200deg;animation-delay:0s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#a98bf5" style="--dx:48px;--dy:6px;--r:240deg;animation-delay:0.05s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#ffc247" style="--dx:-30px;--dy:-24px;--r:160deg;animation-delay:0.1s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#ff8a6b" style="--dx:34px;--dy:-30px;--r:-180deg;animation-delay:0.03s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#6aa8ff" style="--dx:-54px;--dy:34px;--r:300deg;animation-delay:0.08s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#ffffff" style="--dx:56px;--dy:36px;--r:-260deg;animation-delay:0.12s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#5fe3a8" style="--dx:2px;--dy:-40px;--r:200deg;animation-delay:0.06s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#ffc247" style="--dx:-18px;--dy:46px;--r:-220deg;animation-delay:0.1s"/><rect class="conf" x="47" y="26" width="5" height="9" rx="1.5" fill="#a98bf5" style="--dx:24px;--dy:48px;--r:180deg;animation-delay:0.02s"/><g class="badge"><circle cx="88" cy="16" r="12" fill="#5fe3a8"/><path d="M82 16 l4.5 4.5 8 -9" fill="none" stroke="#0b0e14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
